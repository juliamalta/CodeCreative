name: Deploy to Hostinger via FTP

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build FTP version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 20.x
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build static FTP version
              run: yarn run build:ftp

            - name: Upload static site artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: codecreative-out
                  path: out/
                  if-no-files-found: error

    deploy:
        name: Deploy via FTP
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Download static site artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: codecreative-out
                  path: out/

            - name: Deploy via FTP
              uses: SamKirkland/FTP-Deploy-Action@8a24039354ee91000cb948cb4a1dbdf1a1b94a3c # v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  server-dir: ./public_html/
                  local-dir: ./out/
